<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio 129</title>
<meta name="description" content="Gamified practice for reading ISO 129-1 (dimensions and tolerances) in English.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E9EEEA; --sheet:#FBFCFA; --ink:#17211C; --muted:#56675D; --line:#C5D0C8; --grid:rgba(40,96,70,.09);
  --accent:#2A6548; --accent-soft:#DCE9E1; --accent-ink:#FFFFFF;
  --mark:#C4501F; --mark-ink:#FFFFFF; --xp:#B87D0E;
  --ok:#2A7A4B; --ok-soft:#DDF0E3; --bad:#B23F2B; --bad-soft:#F7E1DC;
  --shadow:0 1px 0 rgba(23,33,28,.06), 0 8px 24px -14px rgba(23,33,28,.35);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1512; --sheet:#171F1B; --ink:#E2E9E4; --muted:#95A69B; --line:#2C3932; --grid:rgba(116,193,154,.06);
    --accent:#74C19A; --accent-soft:#1E3228; --accent-ink:#0C1410;
    --mark:#F07A4C; --mark-ink:#1A0D07; --xp:#E5B24C;
    --ok:#74C19A; --ok-soft:#1B3025; --bad:#F07360; --bad-soft:#3A1E19;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1512; --sheet:#171F1B; --ink:#E2E9E4; --muted:#95A69B; --line:#2C3932; --grid:rgba(116,193,154,.06);
  --accent:#74C19A; --accent-soft:#1E3228; --accent-ink:#0C1410;
  --mark:#F07A4C; --mark-ink:#1A0D07; --xp:#E5B24C;
  --ok:#74C19A; --ok-soft:#1B3025; --bad:#F07360; --bad-soft:#3A1E19;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font:16px/1.55 var(--body);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,3.4rem);text-transform:uppercase}
h2{font-size:1.9rem;text-transform:uppercase}
h3{font-size:1.3rem}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet);border-bottom:1.5px solid var(--ink)}
.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
@media (max-width:700px){.bar{position:static}.nav a{font-size:.95rem;padding:3px 6px}}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em}
.brand span{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;color:var(--muted);padding:4px 8px;border-radius:3px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.rank{display:flex;align-items:center;gap:10px;min-width:180px}
.rank .lbl{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1rem;white-space:nowrap}
.meter{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--xp);transition:width .6s ease}
.xp{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:28px}

/* ---------- drawing sheet ---------- */
.sheet{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:var(--shadow);position:relative}
.sheet-in{padding:22px;display:flex;flex-direction:column;gap:18px}
.tblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid var(--ink);font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
.tblock div{padding:6px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tblock div:last-child{border-right:0}
.tblock small{color:var(--muted);font-size:.6rem}
.tblock b{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
@media (max-width:560px){.tblock{grid-template-columns:repeat(2,minmax(0,1fr))}.tblock div:nth-child(2){border-right:0}.tblock div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end}
.hero p{max-width:60ch;font-size:1.08rem}
.hero .lead{display:flex;flex-direction:column;gap:14px}
.memo{border-left:3px solid var(--mark);padding:10px 14px;background:var(--paper);font-size:.98rem}
.memo .eyebrow{color:var(--mark)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.ranks{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:.78rem}
.ranks div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ranks .on{color:var(--accent);font-weight:600}
.level{display:flex;flex-direction:column;gap:12px}
.level-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.level-head h2{font-size:1.5rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
.mcard{display:flex;flex-direction:column;background:var(--sheet);border:1.5px solid var(--ink);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mcard .body{padding:16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard h3{font-size:1.45rem;text-transform:uppercase}
.mcard p{color:var(--muted);font-size:.95rem}
.mcard.locked{opacity:.55;pointer-events:none;border-style:dashed}
.mcard .tblock{grid-template-columns:repeat(3,minmax(0,1fr))}
.mcard .tblock div:nth-child(2){border-right:1px solid var(--line)}
.mcard .tblock div{border-bottom:0!important}
.mini-stamp{position:absolute;top:14px;right:-4px;transform:rotate(8deg);font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:2px solid currentColor}
.mini-stamp.ok{color:var(--ok)} .mini-stamp.bad{color:var(--bad)} .mini-stamp.new{color:var(--mark)} .mini-stamp.lock{color:var(--muted)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px dashed var(--line);background:var(--sheet);font-size:.85rem;line-height:1.25}
.badge svg{flex:none;width:34px;height:34px}
.badge b{display:block;font-family:var(--display);font-size:1.02rem;text-transform:uppercase;letter-spacing:.02em}
.badge.got{border:1.5px solid var(--xp)}
.badge:not(.got) svg{opacity:.35}
.badge .hex{fill:var(--paper);stroke:var(--muted);stroke-width:2}
.badge.got .hex{fill:var(--xp);stroke:var(--xp)}
.badge .gl{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge.got .gl{stroke:var(--sheet)}
.badge small{color:var(--muted)}

/* ---------- mission ---------- */
.mhead{display:flex;flex-direction:column;gap:10px}
.back{font-family:var(--mono);font-size:.78rem;text-decoration:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);background:var(--paper);padding:3px 8px;border-radius:999px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drawing{background:var(--sheet);border:1px solid var(--line);overflow-x:auto}
.drawing svg{display:block;width:100%;height:auto;max-width:100%}
.dw .ol{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.dw .th{fill:none;stroke:var(--ink);stroke-width:1}
.dw .cl{fill:none;stroke:var(--ink);stroke-width:.9;stroke-dasharray:14 3 2 3}
.dw .ar{fill:var(--ink);stroke:none}
.dw .bg{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.dw .tx{fill:var(--ink);font-family:var(--display);font-weight:500;font-size:15px}
.dw .mk circle{fill:var(--mark);transition:r .15s}
.dw .mk text{fill:var(--mark-ink);font:700 11px var(--mono);text-anchor:middle}
.dw .mk.hot circle{r:12}
.dw .hit{fill:var(--ok);fill-opacity:.18;stroke:var(--ok);stroke-width:2}
.dw .miss{stroke:var(--bad);stroke-width:2.5;stroke-linecap:round}
.dw .reveal{fill:none;stroke:var(--bad);stroke-width:2;stroke-dasharray:4 3}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1.5px solid var(--ink);background:var(--sheet);cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;color:var(--ink);border-radius:2px}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.labels{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
@media (max-width:640px){.labels{grid-template-columns:1fr}}
.labels li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.labels .num{width:26px;height:26px;border-radius:50%;background:var(--mark);color:var(--mark-ink);font:700 .75rem/26px var(--mono);text-align:center}
.labels select{width:100%;padding:8px;border:1.5px solid var(--line);background:var(--sheet);border-radius:2px}
.labels .fb{grid-column:2;font-size:.85rem}
.labels li.ok select{border-color:var(--ok);background:var(--ok-soft)}
.labels li.bad select{border-color:var(--bad);background:var(--bad-soft)}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}

.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.match .col{display:flex;flex-direction:column;gap:8px}
.tile{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:1.5px solid var(--line);background:var(--sheet);cursor:pointer;text-align:left;border-radius:2px;font-size:.95rem;line-height:1.2}
.tile:hover{border-color:var(--ink)}
.tile.sel{border-color:var(--mark);box-shadow:inset 0 0 0 1.5px var(--mark)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;opacity:.75}
.tile.shake{animation:shake .35s}
.tile .sym{width:34px;height:34px}
.sym{fill:none;stroke:currentColor;stroke-width:1.8;overflow:visible;vertical-align:middle}
.sym text{fill:currentColor;stroke:none;font:600 15px var(--display)}
.sym .f{fill:currentColor;stroke:none}
.inline-sym .sym{width:1.3em;height:1.3em;vertical-align:-.25em}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}

.q{display:flex;flex-direction:column;gap:16px}
.qcount{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.sentence{font-size:1.3rem;line-height:1.45;max-width:60ch}
.sentence .gap{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--mark);text-align:center;font-family:var(--mono);font-weight:600;color:var(--mark)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opts.col1{grid-template-columns:1fr}
.opt{padding:12px 14px;border:1.5px solid var(--line);background:var(--sheet);cursor:pointer;text-align:left;border-radius:2px;font-size:1rem}
.opt.big{font-family:var(--mono);font-size:1.15rem;text-align:center;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{padding:12px 14px;border-left:3px solid var(--accent);background:var(--paper);font-size:.98rem}
.feedback.bad{border-color:var(--bad)}
.notation{font-family:var(--mono);font-size:2.4rem;font-weight:500;padding:18px;text-align:center;background:var(--paper);border:1px solid var(--line)}
.notation .sym{width:1em;height:1em;vertical-align:-.12em}
.ted{border:1.5px solid currentColor;padding:0 .2em}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:0;padding:0;list-style:none;font-size:.95rem}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.rules b{font-family:var(--mono);color:var(--mark);margin-right:6px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mini{border:1.5px solid var(--line);background:var(--sheet);display:flex;flex-direction:column}
.mini .drawing{border:0;border-bottom:1px solid var(--line)}
.mini .foot{padding:8px;display:flex;gap:8px;align-items:center}
.mini select{flex:1;padding:6px;border:1.5px solid var(--line);background:var(--sheet)}
.mini.ok{border-color:var(--ok)} .mini.bad{border-color:var(--bad)}
.mini .fb{padding:0 8px 8px;font-size:.82rem}

.why{border:1.5px solid var(--mark);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.tally{display:flex;gap:18px;font-family:var(--mono);font-size:.85rem;flex-wrap:wrap}
.found-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}

/* ---------- result stamp ---------- */
.result{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:20px;border:1.5px solid var(--ink);background:var(--sheet)}
@media (max-width:560px){.result{grid-template-columns:1fr}}
.stamp{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:1.25rem;line-height:1.05;border:3px solid currentColor;padding:10px 16px;text-align:center;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;max-width:230px}
.stamp small{display:block;font-size:.72rem;letter-spacing:.14em;font-family:var(--mono);font-weight:500}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.result .score{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result .newb{color:var(--xp);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- glossary ---------- */
.gtools{display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--ink);background:var(--sheet);font-size:1.05rem;border-radius:2px}
.gcount{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.gcat{display:flex;flex-direction:column;gap:10px}
.gcat h2{font-size:1.35rem;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.gitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:680px){.gitems{grid-template-columns:1fr}}
.term{background:var(--sheet);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.term header{display:flex;align-items:flex-start;gap:10px}
.term h3{font-size:1.35rem;flex:1}
.term .es{font-style:italic;color:var(--accent);font-weight:600}
.term .ex{font-size:.92rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.term .cl{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.term .sym{width:30px;height:30px;color:var(--ink)}
.speak{border:1px solid var(--line);background:var(--paper);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.speak:hover{border-color:var(--accent)}
.speak svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8}
mark{background:color-mix(in srgb,var(--xp) 35%,transparent);color:inherit}

/* ---------- prose pages ---------- */
.prose{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem;background:var(--sheet)}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:1rem;background:var(--paper)}
.phrase{font-family:var(--mono);font-size:.9rem;background:var(--paper);padding:10px 12px;border-left:3px solid var(--accent)}
.check{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent)}

/* ---------- escape ---------- */
.locks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.locks{grid-template-columns:1fr}}
.lock{border:1.5px solid var(--ink);background:var(--sheet);padding:14px;display:flex;flex-direction:column;gap:10px}
.lock.open{border-color:var(--ok);background:var(--ok-soft)}
.lock .row{display:flex;gap:8px;align-items:center}
.lock input{width:64px;padding:8px;font-family:var(--mono);font-size:1.4rem;text-align:center;border:1.5px solid var(--ink);background:var(--sheet)}
.dial{display:flex;gap:8px;justify-content:center}
.dial span{width:52px;height:64px;border:2px solid var(--ink);display:grid;place-items:center;font:600 2rem var(--mono);background:var(--sheet)}
.dial span.on{border-color:var(--ok);color:var(--ok)}

/* ---------- certificate ---------- */
.cert{background:var(--sheet);border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:-8px;padding:28px}
.cert .inner{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.cert .name{font-family:var(--display);font-size:clamp(2rem,7vw,3.2rem);font-weight:700;text-transform:uppercase;line-height:1;border-bottom:1.5px solid var(--ink);padding-bottom:6px;min-width:60%}
.code{font-family:var(--mono);font-size:1.3rem;letter-spacing:.12em;padding:6px 12px;border:1.5px dashed var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;max-width:420px}
.field input{padding:10px 12px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:2px}
.foot{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.82rem}

/* ---------- arrangements / special cases ---------- */
.dw .cw{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-dasharray:16 4 2 4}
#task h2{font-size:1.4rem;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-top:8px}
#task{display:flex;flex-direction:column;gap:14px}
.coord{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.coord .tbl table{min-width:0}
@media (max-width:640px){.coord{grid-template-columns:1fr}}
.drawing.narrow{max-width:560px}
.nqs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.nq label{display:block}
.nq input{width:90px;padding:8px;font-family:var(--mono);font-size:1.1rem;border:1.5px solid var(--line);background:var(--sheet);margin-top:4px;border-radius:2px}
.nq.ok input{border-color:var(--ok);background:var(--ok-soft)}
.nq.bad input{border-color:var(--bad);background:var(--bad-soft)}
.nq .fb{display:block;font-size:.88rem;margin-top:4px}

.foot .credit{color:var(--ink);font-size:.9rem}

    terms: ['chain dimensioning', 'parallel dimensioning', 'running dimensioning', 'coordinate dimensioning', 'origin symbol'], clauses: '8.2–8.5', run: runArrangements },
  { id: 'm8', lvl: 4, n: 8, title: 'Special cases', short: 'Symmetrical parts, semicircles, restricted areas, “between” and flag notes.', max: 100, items: '10 questions',
    note: 'These details confuse every new designer. Half views, slots, surfaces that are only partly treated, notes for one feature. Show me you can read them.',
    terms: ['symmetrical part', 'symmetry symbol', 'semicircle', 'restricted area', 'between', 'flag note'], clauses: '7.3.3, 7.5, 7.9, 7.17, 9.1', run: runSpecial },
  { id: 'esc', lvl: 5, n: 9, title: 'The locked workshop', short: 'Open the four locks with numbers hidden in the standard.', max: 100, items: '4 locks',
    note: 'I have locked the workshop. The code is in ISO 129-1 itself. Open the standard, find the four numbers and you are in.',
    terms: ['arrowhead', 'extension line', 'dimensional value'], clauses: '5.4.1, 5.5, 5.7.2, Annex A', run: runEscape }
];
const LEVELS = { 1: ['Level 1', 'The apprentice desk'], 2: ['Level 2', 'The drawing office'], 3: ['Level 3', 'The workshop floor'], 4: ['Level 4', 'The production office'], 5: ['Final', 'Escape the workshop'] };
const MAXXP = MISSIONS.reduce((a, m) => a + m.max, 0);
const RANKS = [[0, 'Apprentice'], [200, 'Draughtsperson'], [450, 'Designer'], [700, 'Senior Designer'], [900, 'Chief Designer']];
const TOTAL = String(MISSIONS.length).padStart(2, '0');

const BADGES = [
  { id: 'first', name: 'First sheet', d: 'Finish your first mission.', g: 'M12 6v12M8 10l4-4 4 4' },
  { id: 'symbols', name: 'Symbol master', d: 'Get every symbol right first time.', g: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0M7 17l10-10' },
  { id: 'quick', name: 'Quick hands', d: 'Finish Symbol match in under 90 s.', g: 'M12 7v5l3 2M12 4a8 8 0 1 0 .01 0' },
  { id: 'rules', name: 'Rule reader', d: 'Score 100% in Shall, should or may.', g: 'M7 8h10M7 12h10M7 16h6' },
  { id: 'clean', name: 'Clean sheet', d: 'Score 100% in any mission.', g: 'M7 12l3 3 7-7' },
  { id: 'eagle', name: 'Eagle eye', d: 'Find all six errors with no wrong taps.', g: 'M4 12s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5M12 10a2 2 0 1 0 .01 0' },
  { id: 'ear', name: 'Good ear', d: 'Listen to 10 glossary terms.', g: 'M6 10v4h3l4 3V7L9 10H6M16 9a4 4 0 0 1 0 6' },
  { id: 'escape', name: 'Escape artist', d: 'Open the locked workshop.', g: 'M8 11V8a4 4 0 0 1 8 0M7 11h10v8H7z' },
  { id: 'chief', name: 'Chief designer', d: 'Reach the top rank.', g: 'M6 16l2-8 4 4 4-4 2 8z' }
];

const xp = () => MISSIONS.reduce((a, m) => a + ((S.scores[m.id] || {}).best || 0), 0);
const rank = (v = xp()) => { let r = RANKS[0], nx = null; for (let i = 0; i < RANKS.length; i++) { if (v >= RANKS[i][0]) { r = RANKS[i]; nx = RANKS[i + 1] || null; } } return { name: r[1], at: r[0], next: nx }; };
const passed = id => { const m = MISSIONS.find(x => x.id === id), s = S.scores[id]; return !!s && s.best >= Math.ceil(m.max * PASS); };
const unlocked = m => { if (S.unlockAll) return true; const i = MISSIONS.indexOf(m); return i === 0 || passed(MISSIONS[i - 1].id); };

function award(id) { if (!S.badges.includes(id)) { S.badges.push(id); return id; } return null; }

/* ---------- top bar ---------- */
function renderBar() {
  const v = xp(), r = rank(v);
  const pct = r.next ? ((v - r.at) / (r.next[0] - r.at)) * 100 : 100;
  $('#rank').innerHTML = `<span class="lbl">${r.name}</span><span class="meter" aria-hidden="true"><i style="width:${pct.toFixed(0)}%"></i></span><span class="xp">${v}/${MAXXP} XP</span>`;
  $('#rank').setAttribute('aria-label', `Rank ${r.name}, ${v} of ${MAXXP} XP`);
  const h = location.hash.slice(1) || 'home';
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.r === h || (a.dataset.r === 'home' && /^m\d|esc/.test(h)) ? 'page' : 'false'));
}

const titleBlock = (cells) => `<div class="tblock">${cells.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;

function badgeHTML(b) {
  const got = S.badges.includes(b.id);
  return `<div class="badge${got ? ' got' : ''}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="hex" d="M12 1.5l9.5 5.5v10L12 22.5 2.5 17V7z"/><path class="gl" d="${b.g}" transform="translate(2.4 2.4) scale(.8)"/></svg><div><b>${b.name}</b><small>${got ? 'Earned' : b.d}</small></div></div>`;
}

    </div></div></div>

  html += `<section class="level"><div class="level-head"><span class="eyebrow">${S.badges.length} of ${BADGES.length}</span><h2>Badges</h2></div><div class="badges">${BADGES.map(badgeHTML).join('')}</div></section>

  <div class="foot"><p class="credit">Created by <b>${esc(AUTHOR)}</b> · ${esc(AUTHOR_PLACE)}</p><p>Studio 129 uses short paraphrases of ISO 129-1:2018 (UNE-EN ISO 129-1:2019) for teaching. All drawings are original. Read the full standard through the UPV Library${LIBRARY_URL ? ` (<a href="${LIBRARY_URL}" target="_blank" rel="noopener">open AENORmás</a>)` : ' (AENORmás)'}.</p>

}

/* ---------- mission shell ---------- */

function finish(m, score, extra = '') {
  const prev = S.scores[m.id] || { best: 0, tries: 0 };
  const first = prev.tries === 0;
  const best = Math.max(prev.best, score);
  const gained = best - prev.best;
  S.scores[m.id] = { best, tries: prev.tries + 1, last: score };
  const nb = [award('first')];
  if (score === m.max) nb.push(award('clean'));
  if (m.id === 'm3' && score === m.max) nb.push(award('rules'));
  if (xp() >= RANKS[RANKS.length - 1][0]) nb.push(award('chief'));
  if (extra && extra.badges) extra.badges.forEach(b => nb.push(award(b)));
  const newB = nb.filter(Boolean).map(id => BADGES.find(b => b.id === id).name);
  save(); renderBar();
  const ok = score >= Math.ceil(m.max * PASS);
  const idx = MISSIONS.indexOf(m), next = MISSIONS[idx + 1];
  const nextBtn = ok && next ? `<a class="btn primary" href="#${next.id}">Next: ${esc(next.title)}</a>` : ok && !next ? `<a class="btn primary" href="#cert">Get your certificate</a>` : '';
  $('#result').innerHTML = `<div class="result" role="status">
    <div class="stamp ${ok ? 'ok' : 'bad'}">${ok ? 'Approved<small>for manufacture</small>' : 'Returned<small>revise and resubmit</small>'}</div>
    <div class="stack" style="gap:10px">
      <div><span class="score">${score}</span> <span class="muted">/ ${m.max} points</span></div>
      <p>${gained > 0 ? `+${gained} XP added to your total.` : first ? '' : `Your best score on this sheet is still ${best}.`} ${ok ? '' : `You need ${Math.ceil(m.max * PASS)} points for approval.`}</p>
      ${newB.length ? `<p class="newb">New badge: ${newB.join(', ')}</p>` : ''}
      ${extra && extra.html ? extra.html : ''}
      <div class="actions">${nextBtn}<button class="btn" id="again">Try again</button><a class="btn" href="#home">All sheets</a></div>
    </div></div>`;
  $('#again').onclick = () => viewMission(m);
  $('#result').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
}

/* ---------- M1: anatomy ---------- */
function runAnatomy(el, m) {

    <div class="actions"><button class="btn primary" id="check">Send to the workshop</button><span class="muted" id="left"></span></div>`;
  const hot = i => $$('.mk', el).forEach(g => g.classList.toggle('hot', +g.dataset.i === i));

      s.disabled = true;
    });
    $('#check', el).disabled = true;
    finish(m, c * 10);

}

/* ---------- M2: symbols ---------- */
function runSymbols(el, m) {
  const left = shuffle(SYMBOL_ITEMS), right = shuffle(SYMBOL_ITEMS);
  let sel = null, done = 0, score = 0, t0 = 0, tick = null;
  const missed = new Set();
  el.innerHTML = `<div class="actions" style="justify-content:space-between"><p class="muted">Tap a symbol, then tap its meaning.</p><span class="timer" id="timer">0:00</span></div>
    <div class="match"><div class="col">${left.map(([k]) => `<button class="tile" data-k="${k}" aria-label="Symbol">${SYM[k]}</button>`).join('')}</div>
    <div class="col">${right.map(([k, d]) => `<button class="tile" data-m="${k}">${d}</button>`).join('')}</div></div>`;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const start = () => { if (!t0) { t0 = Date.now(); tick = setInterval(() => { const t = $('#timer'); if (!t) return clearInterval(tick); t.textContent = fmt((Date.now() - t0) / 1000); }, 250); } };
  $$('[data-k]', el).forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; start(); $$('[data-k]', el).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; });
  $$('[data-m]', el).forEach(b => b.onclick = () => {
    if (b.classList.contains('done')) return;
    if (!sel) { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 350); return; }
    const k = sel.dataset.k;
    if (b.dataset.m === k) {
      sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
      if (!missed.has(k)) score += 10;
      sel = null; done++;
      if (done === SYMBOL_ITEMS.length) {
        clearInterval(tick);
        const secs = (Date.now() - t0) / 1000, badges = [];
        if (secs < 90) badges.push('quick');
        if (score === m.max) badges.push('symbols');
        finish(m, score, { badges, html: `<p class="muted">Time: ${fmt(secs)}. ${missed.size ? `First-try misses: ${missed.size}.` : 'No misses.'}</p>` });
      }
    } else {
      missed.add(k);
      [b, sel].forEach(x => { x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 350); });
    }
  });
}

/* ---------- generic one-at-a-time runner ---------- */
function runSeq(el, m, items, draw) {
  let i = 0, score = 0;
  const step = () => {
    if (i >= items.length) { finish(m, score); return; }
    el.innerHTML = `<div class="q"><div class="progress"><i style="width:${(i / items.length) * 100}%"></i></div><span class="qcount">Question ${i + 1} of ${items.length} · ${score} points</span><div id="qb"></div></div>`;
    draw($('#qb', el), items[i], right => { if (right) score += 10; },
      () => { i++; step(); }, i === items.length - 1);
  };
  step();
}

/* ---------- M3: shall / should / may ---------- */
function runModals(el, m) {
  runSeq(el, m, shuffle(MODAL_ITEMS), (box, [s, ans, cl], add, next, last) => {
    const parts = s.split('___');
    box.innerHTML = `<p class="sentence">${esc(parts[0])}<span class="gap" id="gap">?</span>${esc(parts[1])}</p>
      <div class="opts">${['shall', 'should', 'may'].map(o => `<button class="opt big" data-o="${o}">${o}</button>`).join('')}</div><div id="fb"></div>`;
    $$('.opt', box).forEach(b => b.onclick = () => {

}

/* ---------- M6: spot the error ---------- */
function runErrors(el, m) {
  const found = new Map(); let wrong = 0, pending = null, over = false;
  el.innerHTML = `<div class="tally"><span id="tf">Found 0 / ${ERRORS.length}</span><span id="tw">Wrong taps 0</span><span id="tj">Explained 0</span></div>
    <div class="drawing" id="dwbox">${errorSVG()}</div>
    <div id="why"></div>
    <ol class="found-list" id="flist"></ol>
    <div class="actions"><button class="btn" id="giveup">Show the ones I missed</button></div>`;
  const s = $('svg', el), marks = $('#marks', s);
  const inside = (e, x, y) => e.c ? Math.hypot(x - e.c[0], y - e.c[1]) <= e.c[2] + 4 : (x >= e.r[0] - 4 && x <= e.r[0] + e.r[2] + 4 && y >= e.r[1] - 4 && y <= e.r[1] + e.r[3] + 4);
  const shape = (e, cls) => e.c ? `<circle class="${cls}" cx="${e.c[0]}" cy="${e.c[1]}" r="${e.c[2]}"/>` : `<rect class="${cls}" x="${e.r[0]}" y="${e.r[1]}" width="${e.r[2]}" height="${e.r[3]}"/>`;
  const tally = () => { $('#tf', el).textContent = `Found ${found.size} / ${ERRORS.length}`; $('#tw', el).textContent = `Wrong taps ${wrong}`; $('#tj', el).textContent = `Explained ${[...found.values()].filter(Boolean).length}`; };
  s.addEventListener('click', ev => {
    if (over || pending) return;
    const pt = s.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(s.getScreenCTM().inverse());
    const e = ERRORS.find(x => !found.has(x.id) && inside(x, p.x, p.y));
    if (!e) {
      if (ERRORS.some(x => found.has(x.id) && inside(x, p.x, p.y))) return;
      wrong++; marks.insertAdjacentHTML('beforeend', `<path class="miss" d="M${p.x - 5} ${p.y - 5}l10 10m0-10l-10 10"/>`); tally(); return;
    }
    marks.insertAdjacentHTML('beforeend', shape(e, 'hit'));
    pending = e; found.set(e.id, false); tally();
    const opts = shuffle([e, ...shuffle(ERRORS.filter(x => x !== e)).slice(0, 2)]);
    $('#why', el).innerHTML = `<div class="why"><b>You found a mistake. Which rule does it break?</b><div class="opts col1">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.why)}</button>`).join('')}</div></div>`;
    $('#why', el).scrollIntoView({ block: 'nearest' });
    $$('#why .opt', el).forEach(b => b.onclick = () => {
      const right = b.dataset.id === e.id; found.set(e.id, right);
      $('#flist', el).insertAdjacentHTML('beforeend', `<li><span class="${right ? 'ok-t' : 'bad-t'}">${right ? 'Explained' : 'Found, wrong reason'}</span> · ${esc(e.why)} <span class="mono muted">(${e.cl})</span></li>`);
      $('#why', el).innerHTML = ''; pending = null; tally();
      if (found.size === ERRORS.length) end();
    });
  });
  function end() {
    over = true; $('#giveup', el).disabled = true;
    ERRORS.filter(x => !found.has(x.id)).forEach(x => { marks.insertAdjacentHTML('beforeend', shape(x, 'reveal')); $('#flist', el).insertAdjacentHTML('beforeend', `<li><span class="bad-t">Missed</span> · ${esc(x.why)} <span class="mono muted">(${x.cl})</span></li>`); });
    $('#why', el).innerHTML = '';
    const expl = [...found.values()].filter(Boolean).length;
    const badges = found.size === ERRORS.length && wrong === 0 ? ['eagle'] : [];
    finish(m, found.size * 10 + expl * 10, { badges, html: `<p class="muted">Found ${found.size}, explained ${expl}, wrong taps ${wrong}.</p>` });
  }
  $('#giveup', el).onclick = () => { if (!pending) end(); };
}

/* ---------- certificate ---------- */
function code(name, v) {
  let h = 2166136261; const s = name.trim().toLowerCase().replace(/\s+/g, ' ') + '|' + v + '|iso129';
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return '129-' + (h >>> 0).toString(36).toUpperCase().padStart(7, '0').slice(-6);
}
